<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Birr Wise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .stat-card .num { font-size: 1.8rem; font-weight: 700; color: var(--gold); }
    .stat-card .label { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .filters button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .filters button.active { background: var(--gold); color: #000; border-color: var(--gold); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 500; font-size: 0.85rem; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge-PENDING { background: #fbbf24; color: #000; }
    .badge-APPROVED { background: #22c55e; color: #000; }
    .badge-REJECTED { background: #ef4444; color: #fff; }
    .actions button {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      margin-right: 6px;
    }
    .btn-approve { background: #22c55e; color: #000; }
    .btn-reject { background: #ef4444; color: #fff; }
    .btn-view { background: var(--border); color: var(--text); }
    .settings-form { display: grid; gap: 16px; max-width: 500px; }
    .tabs { display: flex; gap: 12px; margin-bottom: 28px; }
    .tabs button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      padding: 8px 0;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tabs button.active { color: var(--gold); border-bottom-color: var(--gold); }
    @media (max-width: 700px) {
      .stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="logo">
        <a href="/"><img src="logo.png" alt="BirrWise" /></a>
      </div>
      <nav class="nav">
        <a href="/">መነሻ</a>
        <a href="#" onclick="logout();return false;">ውጣ</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h2 style="font-family:var(--font-display);margin-bottom:24px">Admin Dashboard</h2>

      <div class="tabs">
        <button class="active" data-tab="requests">የክፍያ ጥያቄዎች</button>
        <button data-tab="settings">የመክፈያ ቅንብሮች</button>
      </div>

      <!-- Requests Tab -->
      <div id="tab-requests">
        <div class="stats" id="stats">
          <div class="stat-card"><div class="num" id="s-approved">-</div><div class="label">የተሳኩ ግዢዎች</div></div>
          <div class="stat-card"><div class="num" id="s-pending">-</div><div class="label">በመጠባበቅ ላይ</div></div>
          <div class="stat-card"><div class="num" id="s-rejected">-</div><div class="label">ተቀባይነት ያላገኙ</div></div>
          <div class="stat-card"><div class="num" id="s-customers">-</div><div class="label">ደንበኞች</div></div>
        </div>

        <div class="filters">
          <button class="active" data-status="">ሁሉም</button>
          <button data-status="PENDING">PENDING</button>
          <button data-status="APPROVED">APPROVED</button>
          <button data-status="REJECTED">REJECTED</button>
        </div>

        <div class="order-wrapper" style="grid-template-columns:1fr;padding:0;overflow:hidden">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>ስም</th>
                  <th>ስልክ</th>
                  <th>Transaction ID</th>
                  <th>ሁኔታ</th>
                  <th>ቀን</th>
                  <th>ድርጊት</th>
                </tr>
              </thead>
              <tbody id="payments-body">
                <tr><td colspan="7" style="text-align:center;padding:30px">በመጫን ላይ...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Settings Tab -->
      <div id="tab-settings" style="display:none">
        <div class="order-wrapper" style="grid-template-columns:1fr;padding:32px;max-width:560px">
          <h3 style="margin-bottom:20px">የመክፈያ መረጃ ያዘምኑ</h3>
          <form id="settings-form" class="settings-form order-form">
            <div class="form-group">
              <label>ዋጋ (ብር)</label>
              <input type="number" id="set-price" name="price" />
            </div>
            <div class="form-group">
              <label>Telebirr ቁጥር</label>
              <input type="text" id="set-telebirr" name="telebirr_number" />
            </div>
            <div class="form-group">
              <label>Telebirr ስም</label>
              <input type="text" id="set-telebirr-name" name="telebirr_name" />
            </div>
            <div class="form-group">
              <label>ባንክ ስም</label>
              <input type="text" id="set-bank" name="bank_name" />
            </div>
            <div class="form-group">
              <label>ባንክ አካውንት ቁጥር</label>
              <input type="text" id="set-account" name="bank_account" />
            </div>
            <div class="form-group">
              <label>ባንክ አካውንት ስም</label>
              <input type="text" id="set-account-name" name="bank_account_name" />
            </div>
            <div class="form-group">
              <label>መመሪያ</label>
              <textarea id="set-instructions" name="instructions" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">አስቀምጥ</button>
            <p id="settings-msg" style="color:var(--gold);display:none"></p>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- Screenshot Modal -->
  <div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center;padding:20px">
    <div style="max-width:90vw;max-height:90vh;position:relative">
      <button onclick="closeModal()" style="position:absolute;top:-40px;right:0;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer">✕</button>
      <img id="modal-img" src="" style="max-width:100%;max-height:85vh;border-radius:8px" />
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    let currentStatus = '';

    async function init() {
      const me = await getMe();
      if (!me.loggedIn || me.role !== 'admin') {
        window.location.href = '/login.html';
        return;
      }
      if (me.mustChangePassword) {
        window.location.href = '/change-password.html';
        return;
      }
      loadStats();
      loadPayments();
      loadSettings();
    }

    // Tabs
    document.querySelectorAll('.tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-requests').style.display = btn.dataset.tab === 'requests' ? 'block' : 'none';
        document.getElementById('tab-settings').style.display = btn.dataset.tab === 'settings' ? 'block' : 'none';
      });
    });

    // Filters
    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStatus = btn.dataset.status;
        loadPayments();
      });
    });

    async function loadStats() {
      const s = await fetch('/api/admin/stats').then(r => r.json());
      document.getElementById('s-approved').textContent = s.totalApproved;
      document.getElementById('s-pending').textContent = s.totalPending;
      document.getElementById('s-rejected').textContent = s.totalRejected;
      document.getElementById('s-customers').textContent = s.totalCustomers;
    }

    async function loadPayments() {
      const url = currentStatus ? `/api/admin/payments?status=${currentStatus}` : '/api/admin/payments';
      const rows = await fetch(url).then(r => r.json());
      const tbody = document.getElementById('payments-body');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px">ምንም ጥያቄ የለም</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td>${r.id}</td>
          <td>${escapeHtml(r.full_name)}</td>
          <td>${escapeHtml(r.phone)}</td>
          <td>${escapeHtml(r.transaction_id)}</td>
          <td><span class="badge badge-${r.status}">${r.status}</span></td>
          <td>${new Date(r.created_at + 'Z').toLocaleString()}</td>
          <td class="actions">
            ${r.screenshot_path ? `<button class="btn-view" onclick="viewScreenshot('${r.screenshot_path}')">ፎቶ</button>` : ''}
            ${r.status === 'PENDING' ? `
              <button class="btn-approve" onclick="approve(${r.id})">አጽድቅ</button>
              <button class="btn-reject" onclick="reject(${r.id})">ውድቅ</button>
            ` : ''}
          </td>
        </tr>
      `).join('');
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function viewScreenshot(filename) {
      document.getElementById('modal-img').src = '/api/admin/screenshot/' + filename;
      document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    async function approve(id) {
      if (!confirm('ይህን ክፍያ ማጽደቅ ይፈልጋሉ?')) return;
      const res = await fetch(`/api/admin/payments/${id}/approve`, { method: 'POST' });
      const data = await res.json();
      alert(data.message || data.error);
      loadStats();
      loadPayments();
    }

    async function reject(id) {
      const note = prompt('ምክንያት (አማራጭ):');
      if (note === null) return;
      const res = await fetch(`/api/admin/payments/${id}/reject`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note })
      });
      const data = await res.json();
      alert(data.message || data.error);
      loadStats();
      loadPayments();
    }

    async function loadSettings() {
      const s = await fetch('/api/payment-settings').then(r => r.json());
      document.getElementById('set-price').value = s.price || 200;
      document.getElementById('set-telebirr').value = s.telebirr_number || '';
      document.getElementById('set-telebirr-name').value = s.telebirr_name || '';
      document.getElementById('set-bank').value = s.bank_name || '';
      document.getElementById('set-account').value = s.bank_account || '';
      document.getElementById('set-account-name').value = s.bank_account_name || '';
      document.getElementById('set-instructions').value = s.instructions || '';
    }

    document.getElementById('settings-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        price: document.getElementById('set-price').value,
        telebirr_number: document.getElementById('set-telebirr').value,
        telebirr_name: document.getElementById('set-telebirr-name').value,
        bank_name: document.getElementById('set-bank').value,
        bank_account: document.getElementById('set-account').value,
        bank_account_name: document.getElementById('set-account-name').value,
        instructions: document.getElementById('set-instructions').value,
        account_name: document.getElementById('set-account-name').value
      };
      const res = await fetch('/api/admin/payment-settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      const msg = document.getElementById('settings-msg');
      msg.textContent = data.message || data.error;
      msg.style.display = 'block';
    });

    init();
  </script>
</body>
</html>
