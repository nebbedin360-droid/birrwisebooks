<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ግባ | Birr Wise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="logo">
        <a href="/"><img src="logo.png" alt="BirrWise" /></a>
      </div>
      <nav class="nav">
        <a href="/">መነሻ</a>
        <a href="/register.html">መለያ ፍጠር</a>
      </nav>
    </div>
  </header>

  <section class="section" style="min-height:70vh;display:flex;align-items:center">
    <div class="container" style="max-width:440px">
      <div class="order-wrapper" style="grid-template-columns:1fr;padding:40px">
        <h2 style="text-align:center;margin-bottom:8px;font-family:var(--font-display)">ግባ</h2>
        <p style="text-align:center;color:var(--text-muted);margin-bottom:28px">ወደ መለያዎ ይግቡ</p>

        <form id="login-form" class="order-form">
          <div class="form-group">
            <label for="phone">ስልክ ቁጥር / የተጠቃሚ ስም</label>
            <input type="text" id="phone" name="phone" required placeholder="09... ወይም neb-admin" />
          </div>
          <div class="form-group">
            <label for="password">የይለፍ ቃል</label>
            <input type="password" id="password" name="password" required />
          </div>
          <div id="error" style="color:#f87171;font-size:0.9rem;display:none"></div>
          <button type="submit" class="btn btn-primary btn-full">ግባ</button>
        </form>
        <p style="text-align:center;margin-top:20px;color:var(--text-muted);font-size:0.95rem">
          መለያ የሎትም? <a href="/register.html" style="color:var(--gold)">መለያ ፍጠር</a>
        </p>
      </div>
    </div>
  </section>

  <script src="common.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';

      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'ስህተት ተፈጥሯል';
          errorEl.style.display = 'block';
          return;
        }
        if (data.mustChangePassword) {
          window.location.href = '/change-password.html';
        } else if (data.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/account.html';
        }
      } catch (err) {
        errorEl.textContent = 'የኔትወርክ ስህተት';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
