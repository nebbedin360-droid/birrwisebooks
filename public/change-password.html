<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>የይለፍ ቃል ቀይር | Birr Wise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="logo">
        <a href="/"><img src="logo.png" alt="BirrWise" /></a>
      </div>
    </div>
  </header>

  <section class="section" style="min-height:70vh;display:flex;align-items:center">
    <div class="container" style="max-width:440px">
      <div class="order-wrapper" style="grid-template-columns:1fr;padding:40px">
        <h2 style="text-align:center;margin-bottom:8px;font-family:var(--font-display)">የይለፍ ቃል ይቀይሩ</h2>
        <p style="text-align:center;color:var(--text-muted);margin-bottom:28px">
          ለመጀመሪያ ጊዜ ስለገቡ አዲስ የይለፍ ቃል ማዘጋጀት አለብዎት
        </p>

        <form id="form" class="order-form">
          <div class="form-group">
            <label>አዲስ የይለፍ ቃል *</label>
            <input type="password" id="newPassword" required minlength="6" />
          </div>
          <div class="form-group">
            <label>አዲሱን ይድገሙ *</label>
            <input type="password" id="confirmPassword" required minlength="6" />
          </div>
          <div id="error" style="color:#f87171;font-size:0.9rem;display:none"></div>
          <button type="submit" class="btn btn-primary btn-full">አስቀምጥ</button>
        </form>
      </div>
    </div>
  </section>

  <script src="common.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      try {
        const res = await fetch('/api/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ newPassword, confirmPassword })
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'ስህተት';
          errorEl.style.display = 'block';
          return;
        }
        // Redirect based on role
        const me = await getMe();
        if (me.role === 'admin') window.location.href = '/admin.html';
        else window.location.href = '/account.html';
      } catch {
        errorEl.textContent = 'የኔትወርክ ስህተት';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
