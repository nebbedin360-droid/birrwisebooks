<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>መለያዬ | Birr Wise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .status-PENDING { background: #fbbf24; color: #000; }
    .status-APPROVED { background: #22c55e; color: #000; }
    .status-REJECTED { background: #ef4444; color: #fff; }
    .pay-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .pay-box strong { color: var(--gold); }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="logo">
        <a href="/"><img src="logo.png" alt="BirrWise" /></a>
      </div>
      <nav class="nav">
        <a href="/">መነሻ</a>
        <a href="#" onclick="logout();return false;">ውጣ</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:700px">
      <h2 style="font-family:var(--font-display);margin-bottom:8px">ሰላም፣ <span id="user-name">...</span></h2>
      <p style="color:var(--text-muted);margin-bottom:32px">መለያዎ እና የመጽሐፍ ሁኔታ</p>

      <!-- Status Card -->
      <div class="order-wrapper" style="grid-template-columns:1fr;padding:32px;margin-bottom:32px" id="status-card">
        <div id="status-content">በመጫን ላይ...</div>
      </div>

      <!-- Payment Form (shown only if no purchase & no pending) -->
      <div class="order-wrapper" style="grid-template-columns:1fr;padding:32px;display:none" id="payment-section">
        <h3 style="margin-bottom:16px;font-family:var(--font-display)">ክፍያ ያድርጉ</h3>

        <div class="pay-box">
          <p><strong>ዋጋ፡</strong> <span id="price">200</span> ብር</p>
          <p style="margin-top:12px"><strong>Telebirr፡</strong> <span id="telebirr">0937798081 — Hanif</span></p>
          <p style="margin-top:8px"><strong>CBE፡</strong> <span id="cbe">1000752299308 — Hanif Sebir Hetib</span></p>
          <p style="margin-top:12px;color:var(--text-muted);font-size:0.95rem" id="instructions">
            ከላይ ካሉት የመክፈያ መንገዶች አንዱን በመጠቀም ይላኩ። ከዚያ ቅጹን ይሙሉ።
          </p>
        </div>

        <form id="payment-form" class="order-form" enctype="multipart/form-data">
          <div class="form-group">
            <label>ሙሉ ስም *</label>
            <input type="text" name="full_name" id="full_name" required />
          </div>
          <div class="form-group">
            <label>ስልክ ቁጥር *</label>
            <input type="tel" name="phone" id="pay-phone" required />
          </div>
          <div class="form-group">
            <label>የትራንዛክሽን መለያ (Transaction ID) *</label>
            <input type="text" name="transaction_id" required placeholder="ለምሳሌ: TXN123456" />
          </div>
          <div class="form-group">
            <label>የክፍያ ማረጋገጫ ፎቶ *</label>
            <input type="file" name="screenshot" accept="image/*" required />
            <p class="form-note">JPG, PNG — ከ5MB በታች</p>
          </div>
          <div id="pay-error" style="color:#f87171;font-size:0.9rem;display:none"></div>
          <button type="submit" class="btn btn-primary btn-full" id="pay-btn">ክፍያ አረጋግጥ</button>
        </form>
      </div>
    </div>
  </section>

  <script src="common.js"></script>
  <script>
    async function load() {
      const me = await getMe();
      if (!me.loggedIn) {
        window.location.href = '/login.html';
        return;
      }
      if (me.role === 'admin') {
        window.location.href = '/admin.html';
        return;
      }
      if (me.mustChangePassword) {
        window.location.href = '/change-password.html';
        return;
      }

      document.getElementById('user-name').textContent = me.name;

      // Load payment settings
      const settings = await fetch('/api/payment-settings').then(r => r.json());
      if (settings.price) document.getElementById('price').textContent = settings.price;
      if (settings.telebirr_number) {
        document.getElementById('telebirr').textContent =
          `${settings.telebirr_number} — ${settings.telebirr_name || ''}`;
      }
      if (settings.bank_account) {
        document.getElementById('cbe').textContent =
          `${settings.bank_account} — ${settings.bank_account_name || ''}`;
      }
      if (settings.instructions) {
        document.getElementById('instructions').textContent = settings.instructions;
      }

      // Load status
      const status = await fetch('/api/my-status').then(r => r.json());
      const statusEl = document.getElementById('status-content');
      const paySection = document.getElementById('payment-section');

      if (status.hasPurchase) {
        statusEl.innerHTML = `
          <h3 style="color:var(--gold);margin-bottom:12px">✓ መጽሐፉ የእርስዎ ነው</h3>
          <p style="color:var(--text-muted);margin-bottom:20px">ክፍያዎ ጸድቋል። መጽሐፉን ማውረድ ይችላሉ።</p>
          <button class="btn btn-primary" onclick="downloadBook()">መጽሐፉን አውርድ</button>
        `;
      } else if (status.latestRequest) {
        const s = status.latestRequest;
        statusEl.innerHTML = `
          <h3 style="margin-bottom:12px">የክፍያ ሁኔታ</h3>
          <p>ሁኔታ፡ <span class="status-badge status-${s.status}">${s.status}</span></p>
          <p style="margin-top:8px;color:var(--text-muted);font-size:0.95rem">
            የትራንዛክሽን መለያ፡ ${s.transaction_id}<br>
            ቀን፡ ${new Date(s.created_at + 'Z').toLocaleString()}
          </p>
          ${s.status === 'PENDING' ? '<p style="margin-top:16px;color:var(--text-muted)">ክፍያዎ እየተረጋገጠ ነው። እባክዎ ይጠብቁ።</p>' : ''}
          ${s.status === 'REJECTED' ? `<p style="margin-top:16px;color:#f87171">ተቀባይነት አላገኘም። ${s.admin_note || ''} እንደገና መሞከር ይችላሉ።</p>` : ''}
        `;
        if (s.status === 'REJECTED') {
          paySection.style.display = 'block';
        }
      } else {
        statusEl.innerHTML = `
          <h3 style="margin-bottom:12px">ገና አልገዙም</h3>
          <p style="color:var(--text-muted)">ከታች ያለውን ቅጽ በመሙላት ክፍያዎን ያረጋግጡ።</p>
        `;
        paySection.style.display = 'block';
      }
    }

    async function downloadBook() {
      const res = await fetch('/api/download-book');
      if (res.status === 404) {
        const data = await res.json();
        alert(data.error || 'መጽሐፉ ገና አልተጫነም');
        return;
      }
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || 'ስህተት');
        return;
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'በ10ሺ_ብር_ምን_ልስራ.pdf';
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('payment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('pay-error');
      const btn = document.getElementById('pay-btn');
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'በመላክ ላይ...';

      const formData = new FormData(e.target);

      try {
        const res = await fetch('/api/payment-request', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'ስህተት';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'ክፍያ አረጋግጥ';
          return;
        }
        alert(data.message);
        load(); // refresh
      } catch (err) {
        errorEl.textContent = 'የኔትወርክ ስህተት';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'ክፍያ አረጋግጥ';
      }
    });

    load();
  </script>
</body>
</html>
